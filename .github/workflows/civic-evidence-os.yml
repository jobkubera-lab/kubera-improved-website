name: Civic Evidence OS

on:
  pull_request:
    paths:
      - "civic-evidence-os/**"
      - ".github/workflows/civic-evidence-os.yml"
  push:
    branches: [main]
    paths:
      - "civic-evidence-os/**"
      - ".github/workflows/civic-evidence-os.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: civic-evidence-os
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run executable examples
        run: |
          PYTHONPATH=. python examples/01_basic_lookup.py
          PYTHONPATH=. python examples/02_with_profile.py
          PYTHONPATH=. python examples/03_evidence_trail.py
      - name: Run browser finder parity smoke test
        run: node web/parity.test.mjs
